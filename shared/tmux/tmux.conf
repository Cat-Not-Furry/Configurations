# ~/.config/tmux/tmux.conf — Hyprland dotfiles
# Colores activos: colors.active.conf (apply-theme.sh)
# Prefijo: Alt+a (sin Ctrl — foot/readline no se pelean)

# Colores: colors.active.conf (apply-theme.sh) o fallback blue
if-shell 'test -f ~/.config/tmux/colors.active.conf' \
  'source-file ~/.config/tmux/colors.active.conf' \
  'source-file ~/.config/tmux/colors/blue.conf'

# --- Terminal (foot / alacritty) ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -s escape-time 20
set -g aggressive-resize on
set -g history-limit 50000
set -g display-time 800

# --- Índices ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefijo: Alt+a ---
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# --- Ratón ---
set -g mouse on

# --- Clipboard (foot + nvim) ---
set -g set-clipboard on
setw -g allow-passthrough on

# --- Splits en cwd actual (Alt+a luego tecla) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Recargar config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux recargado"

# --- Modo paneles: Alt+Space (suelta) → flecha entre splits ---
bind -n M-Space switch-client -T nav_panes \; display "Paneles: flecha · Esc/q salir"
bind -T nav_panes Up select-pane -U
bind -T nav_panes Down select-pane -D
bind -T nav_panes Left select-pane -L
bind -T nav_panes Right select-pane -R
bind -T nav_panes Escape switch-client -T root
bind -T nav_panes q switch-client -T root

# --- Modo ventanas: Alt+Shift+Space (suelta) → flecha entre pestañas ---
bind -n M-S-Space switch-client -T nav_windows \; display "Ventanas: flecha · Esc/q salir"
bind -T nav_windows Up previous-window
bind -T nav_windows Down next-window
bind -T nav_windows Left previous-window
bind -T nav_windows Right next-window
bind -T nav_windows Escape switch-client -T root
bind -T nav_windows q switch-client -T root

# --- Atajos sin prefijo (útiles en foot) ---
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before -p "¿Cerrar panel? (y/n)" kill-pane

# --- Status bar ---
set -g status-position bottom
set -g status-interval 60
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[bold]#S#[default] '
set -g status-right '#(~/.config/tmux/scripts/status-updates.sh 2>/dev/null) #[fg=default,nobold]| %H:%M '
