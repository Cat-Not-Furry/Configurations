# Perfil tmux X11 — grises neutros (activado por x11-environment.sh)
# Fondo alineado con iceberg/bumblebee; acentos desaturados.

set -g status-style 'bg=#161821,fg=#c6c8d1'
set -g status-left-style 'bg=#3d4455,fg=#c6c8d1,bold'
set -g status-right-style 'bg=#161821,fg=#8b919e'
set -g window-status-style 'bg=#161821,fg=#8b919e'
set -g window-status-current-style 'bg=#565f75,fg=#e2e4ea,bold'
set -g pane-border-style 'fg=#3d4455'
set -g pane-active-border-style 'fg=#565f75'
set -g message-style 'bg=#3d4455,fg=#e2e4ea'
