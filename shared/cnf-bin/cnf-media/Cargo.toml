[package]
name = "cnf-media"
version = "0.1.0"
edition = "2021"
description = "MPRIS media control for cnf-bin dotfiles (Waybar, bumblebee)"
license = "MIT"

[[bin]]
name = "cnf-media"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
