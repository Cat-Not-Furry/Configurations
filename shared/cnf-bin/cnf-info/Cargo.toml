[package]
name = "cnf-info"
version = "0.1.0"
edition = "2021"
description = "Hardware info and controls for cnf-bin dotfiles"
license = "MIT"

[[bin]]
name = "cnf-info"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
