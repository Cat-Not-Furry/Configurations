# --- Backend ---
backend = "glx";
vsync = true;

# --- Opciones de rendimiento para GLX---
glx-copy-from-front = false;
use-damage = true; # Ayuda a reducir el redibujado innecesario

# --- Sombras ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

# --- Opacidad / Transparencia ---
inactive-opacity = 0.9
active-opacity = 1.0;
inactive-dim = 0.1;
frame-opacity = 1.0; # Recomendado en 1.0 para evitar bordes extraños
inactive-opacity-override = false; # Cambiado a false para mejor compatibilidad

# --- Desenfoque (Blur) ---
blur: {
  method = "dual_kawase";
  strength = 2;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Bordes Redondeados ---
corner-radius = 10; # Un poco menos agresivo
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Fading / Desvanecimiento ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# ==================================
# --- ¡AQUÍ ESTÁ LA MAGIA! ---
# --- Animaciones Experimentales ---
# ==================================
animations = true;
animation-window-mass = 0.5;
animation-dampening = 10;
animation-stiffness = 150;

# Tipos de animación: "linear", "easeIn", "easeOut", "easeInOut", "easeInQuad", "easeOutQuad", "easeInOutQuad", "easeInCubic", "easeOutCubic", "easeInOutCubic"
# O puedes usar animaciones físicas como "fly-in", "slide-up", "slide-down", "slide-left", "slide-right", "squeeze"

# Animación para abrir y cerrar ventanas
animation-for-open-window = "slide-up"; # o "slide-down"
# Animación para ventanas sin foco que se cierran
animation-for-unmap-window = "squeeze";

# Animación para cambiar de espacio de trabajo (fade)
animation-for-workspace-switch-in = "easeInCubic";
animation-for-workspace-switch-out = "easeOutCubic";

# --- Exclusiones Generales ---
# Excluir ciertas aplicaciones de todos los efectos si dan problemas
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; corner-radius = 10; };
  dock = { shadow = true; clip-shadow-above = true; }
  dnd = { shadow = true; }
  popup_menu = { opacity = 0.9; corner-radius = 10; }
  dropdown_menu = { opacity = 0.9; corner-radius = 10; }
  dialog = { shadow = true; opacity = 0.95; corner-radius = 10; } # Regla para diálogos
  notification = { shadow = false; corner-radius = 15; } # Regla para notificaciones
};
