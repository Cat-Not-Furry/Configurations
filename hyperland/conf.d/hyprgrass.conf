# Hyprgrass: pantalla táctil (elan-touchscreen). Requiere: hyprpm enable hyprgrass
# Dependencia sistema (bordes atrás/adelante): pacman -S wtype
# Touchpad: conf.d/gestures.conf (sin cambios)

plugin {
    hyprgrass {
        sensitivity = 4.0
        long_press_delay = 450
        edge_margin = 24
        resize_on_border_long_press = false

        # --- 1-2 dedos: apps (centro = clic/scroll nativo; sin swipe custom) ---
        hyprgrass-bind = , edge:l:r, exec, wtype -M alt -k Left -M alt
        hyprgrass-bind = , edge:r:l, exec, wtype -M alt -k Right -M alt

        # --- 3 dedos: sistema ---
        hyprgrass-gesture = swipe, 3, horizontal, workspace
        hyprgrass-gesture = swipe, 3, down, close
        hyprgrass-bind = , longpress:3, overview:toggle

        # --- 4 dedos: sistema ---
        # workspace horizontal solo con 3 dedos (horizontal sombrea left/right en Hyprgrass)
        hyprgrass-gesture = swipe, 4, up, fullscreen
        hyprgrass-gesture = swipe, 4, down, float
        hyprgrass-gesture = swipe, 4, right, emulate_touchpad, 3, right
        hyprgrass-gesture = swipe, 4, left, emulate_touchpad, 3, left

        # --- Bordes verticales: sistema (cualquier nº de dedos) ---
        hyprgrass-bind = , edge:d:u, exec, /home/cipactli_mx/.config/hypr/scripts/wofi-launch.sh
        hyprgrass-bind = , edge:u:d, exec, swaync-client -t -sw
    }
}
