# Ventanas emergentes / diálogos — deben flotar como en un DE tradicional

# Modales globales (confirmaciones, alertas)
windowrule = match:modal true, float on, center on

# Selectores de archivos (portal GTK y nativos)
windowrule = match:class xdg-desktop-portal-gtk, float on, center on, size 700 900
windowrule = match:class org.freedesktop.impl.portal.desktop.gtk, float on, center on, size 700 900
windowrule = match:class org.gtk.FileChooserDialog, float on, center on, size 700 900
windowrule = match:title ^(Open File|Open|Save As|Choose Files|Select a File|File Operation Progress|Confirm to replace files)$, float on, center on, size 700 900

# Utilidades del setup
windowrule = match:class pavucontrol, float on, center on, size 800 600
windowrule = match:class blueman-manager, float on, center on, size 800 600
windowrule = match:class nm-connection-editor, float on, center on, size 900 700
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, float on, center on

# Diálogos genéricos (zenity/yad, about, calculadora)
windowrule = match:class Zenity, float on, center on
windowrule = match:class yad, float on, center on
windowrule = match:title ^(About|Preferences|Settings|Calculator|Calculadora)$, float on, center on

# CopyQ
windowrule = match:class com.github.hluk.copyq, float on, center on, size 800 600

# Terminales foot (utilidades con título fijo)
windowrule = match:class foot, match:title ^ignis-kexec$, float on, center on, size 600 800
windowrule = match:class foot, match:title ^ignis-htop$, float on, center on, size 900 600
windowrule = match:class foot, match:title ^ignis-cal$, float on, center on, size 520 420
windowrule = match:class foot, match:title ^ignis-fastfetch$, float on, center on, size 720 520

# Utilidades GUI
windowrule = match:class galculator, float on, center on, size 400 500
windowrule = match:class xfce4-taskmanager, float on, center on, size 800 600
windowrule = match:class ark, float on, center on, size 700 500
windowrule = match:class feh, float on, center on
