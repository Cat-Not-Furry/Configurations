binds {
    workspace_back_and_forth = false
}

# Lanzar aplicaciones
bind = $mainMod, T, exec, foot
bind = $mainMod SHIFT, T, exec, foot
bind = $mainMod SHIFT, Z, exec, rofi -modi drun,run -show drun -show-icons
bind = $mainMod, D, exec, ~/.config/hypr/scripts/wofi-launch.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/wofi-script.sh
bind = $mainMod SHIFT, A, exec, ~/.config/hypr/scripts/wofi-script1.sh
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/hyprsunset-on.sh
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/hyprsunset-off.sh

# Matar ventana / reload / lock
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod ALT, B, exec, hyprlock

# Fondos de video con mpvpaper
bind = $mainMod, P, exec, killall mpvpaper; mpvpaper -p -o "no-audio loop" eDP-1 ~/Videos/Wallpapers/Posejojo.mp4 &
bind = $mainMod SHIFT, P, exec, killall mpvpaper; mpvpaper -p -o "no-audio loop" HDMI-A-2 ~/Videos/Wallpapers/Posejojo.mp4 &
bind = $mainMod, O, exec, killall mpvpaper; mpvpaper -p -o "no-audio loop" eDP-1 ~/Videos/Wallpapers/DVD.mp4 &
bind = $mainMod SHIFT, O, exec, killall mpvpaper; mpvpaper -p -o "no-audio loop" HDMI-A-2 ~/Videos/Wallpapers/DVD.mp4 &
bind = $mainMod, L, exec, killall mpvpaper &

# Movimiento de foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, right, movefocus, r

# Mover ventanas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, right, movewindow, r

# Layout
bind = $mainMod, H, layoutmsg, preselect l
bind = $mainMod, V, layoutmsg, preselect d

bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, Space, cyclenext

# Multimedia
binde = , XF86AudioRaiseVolume, exec, pamixer -i 2
binde = , XF86AudioLowerVolume, exec, pamixer -d 2
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioMicMute, exec, pamixer --default-source -t

# Brillo
binde = , XF86MonBrightnessUp, exec, brightnessctl set +2%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

# Captura de pantalla
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = CONTROL, Print, exec, ~/.config/hypr/scripts/hyprshot-cursor-monitor.sh
bind = $mainMod SHIFT, TAB, overview:toggle

bind = $mainMod, X, exec, copyq toggle
bind = $mainMod SHIFT, X, exec, copyq &

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Redimensionar ventanas (submap)
bind = $mainMod, R, submap, resize

submap = resize
binde = , left, resizeactive, -20 0
binde = , right, resizeactive, 20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
bind = , space, submap, reset
submap = reset
