# Aplicaciones al inicio (escalonadas) y reload sin doble arranque

exec-once = ~/.config/hypr/scripts/hypr-session-init.sh
exec-once = awww-daemon
exec-once = hyprpm reload -n
exec-once = killall ignis 2>/dev/null; sleep 2 && ignis init &
exec-once = sleep 4 && killall waybar 2>/dev/null; sleep 2 && waybar &
exec-once = sleep 8 && ~/.config/hypr/scripts/ensure-tray-services.sh
exec-once = sleep 6 && killall hypridle 2>/dev/null; sleep 2 && hypridle &
exec-once = hyprsunset &
exec-once = setxkbmap -layout us -variant intl

# nm-applet, blueman, copyq → hyperland/scripts/ensure-tray-services.sh (tras waybar)
# swaync, polkit, portales → hyperland/scripts/hypr-session-init.sh

# Solo en hyprctl reload: matar procesos (los scripts hacen ensure si faltan)
# ignis: lo gestionan scripts/apply-theme.sh (hot reload o restart explícito)
# swaync: solo exec-once al inicio de sesión; deploy --all reinicia aparte
exec = killall waybar 2>/dev/null
exec = killall hypridle 2>/dev/null
