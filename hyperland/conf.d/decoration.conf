decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 2
        passes = 2
        new_optimizations = on
    }
}

animations {
    enabled = yes

    bezier = wobbleDrag, 0.15, 1.15, 0.35, 0.95
    bezier = myBezier, 0.04, 0.8, 0.1, 1.04

    animation = windows, 1, 6, myBezier
    animation = windowsIn, 1, 6, myBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = windowsMove, 1, 3.5, wobbleDrag

    animation = border, 1, 9, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, default
}
