# ~/.config/tmux/tmux.conf — Hyprland dotfiles
# Colores activos: colors.active.conf (apply-theme.sh)

source-file ~/.config/tmux/colors.active.conf

# --- Terminal (foot) ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:RGB"
set -g focus-events on
set -s escape-time 20
set -g aggressive-resize on

# --- Índices ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefijo: Ctrl+Space ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Ratón ---
set -g mouse on

# --- Clipboard (foot + nvim) ---
set -g set-clipboard on
setw -g allow-passthrough on

# --- Splits en cwd actual ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Recargar config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux recargado"

# --- Modo paneles: Alt+Space → flechas entre splits ---
bind -n M-Space switch-client -T nav_panes
bind -T nav_panes Up select-pane -U
bind -T nav_panes Down select-pane -D
bind -T nav_panes Left select-pane -L
bind -T nav_panes Right select-pane -R
bind -T nav_panes Escape switch-client -T root
bind -T nav_panes q switch-client -T root

# --- Modo ventanas: Alt+Shift+Space → flechas entre pestañas ---
bind -n M-S-Space switch-client -T nav_windows
bind -T nav_windows Up previous-window
bind -T nav_windows Down next-window
bind -T nav_windows Left previous-window
bind -T nav_windows Right next-window
bind -T nav_windows Escape switch-client -T root
bind -T nav_windows q switch-client -T root

# --- Status bar ---
set -g status-position bottom
set -g status-interval 60
set -g status-left-length 80
set -g status-right-length 120
set -g status-left '#[bold]#(whoami)@#H #[fg=default,nobold]| #S '
set -g status-right '#(~/.config/tmux/scripts/status-updates.sh 2>/dev/null) #[fg=default,nobold]| %H:%M '

# --- Plugins (TPM: prefix + Shift+I para instalar) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.config/tmux/plugins/tpm/tpm'
