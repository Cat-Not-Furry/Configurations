# Plantilla de colores tmux — scripts/generate-tmux-colors.sh
# Placeholders: {{BACKGROUND}} {{FOREGROUND}} {{ACCENT}} {{ACCENT_LIGHT}} {{BORDER}}
# Genera tmux/colors/{slug}.conf desde themes/palettes.json (waybar)

set -g status-style 'bg={{BACKGROUND}},fg={{FOREGROUND}}'
set -g status-left-style 'bg={{ACCENT}},fg={{BACKGROUND}},bold'
set -g status-right-style 'bg={{BACKGROUND}},fg={{FOREGROUND}}'
set -g window-status-style 'bg={{BACKGROUND}},fg={{FOREGROUND}}'
set -g window-status-current-style 'bg={{ACCENT}},fg={{BACKGROUND}},bold'
set -g pane-border-style 'fg={{BORDER}}'
set -g pane-active-border-style 'fg={{ACCENT_LIGHT}}'
set -g message-style 'bg={{ACCENT}},fg={{BACKGROUND}}'
