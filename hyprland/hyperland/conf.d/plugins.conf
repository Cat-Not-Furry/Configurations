# Hyprspace — overview en overlay (no redimensiona el workspace)
# Instalar: hyprpm add https://github.com/KZDKM/Hyprspace
#           hyprpm disable hyprexpo && hyprpm enable hyprspace && hyprpm reload -n
#
# panelHeight/reservedArea: eDP-1 ~1080px con waybar 26px.
# workspaceMargin = separación entre miniaturas y tamaño (Hyprspace usa la misma clave)

# --- Comportamiento (overlay, sin empujar ventanas) ---
plugin:overview:affectStrut = 0
plugin:overview:overrideGaps = 0
plugin:overview:showEmptyWorkspace = 0
plugin:overview:showNewWorkspace = 0
plugin:overview:showSpecialWorkspace = 0
plugin:overview:centerAligned = 1
plugin:overview:exitOnClick = 1
plugin:overview:exitOnSwitch = 1
plugin:overview:exitKey = escape
plugin:overview:drawActiveWorkspace = 1
plugin:overview:hideRealLayers = 1

# --- Panel fullscreen: transparencia total + blur (sin tinte oscuro) ---
plugin:overview:panelHeight = 500
plugin:overview:reservedArea = 30
plugin:overview:panelColor = rgba(00000000)
plugin:overview:panelBorderWidth = 0
plugin:overview:disableBlur = 0

# --- Miniaturas más juntas (300 → 240) ---
plugin:overview:workspaceMargin = 10

# --- Casillas: fondo invisible; solo bordes para ubicar cada workspace ---
plugin:overview:workspaceActiveBackground = rgba(00000000)
plugin:overview:workspaceInactiveBackground = rgba(00000000)
plugin:overview:workspaceActiveBorder = rgba(84a0c6aa)
plugin:overview:workspaceInactiveBorder = rgba(55555566)
plugin:overview:workspaceBorderSize = 1
