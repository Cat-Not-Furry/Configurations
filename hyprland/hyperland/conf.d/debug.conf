# Logs de Hyprland (wiki: Crashes and Bugs)
# Activo: $XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/hyprland.log
# Crashes: ~/.cache/hyprland/hyprlandCrashReport*.txt
# Deploy:  ~/.cache/hypr/deploy.log
# Resumen: ~/.config/hypr/scripts/hypr-crash-info.sh

debug {
    disable_logs = false
    disable_time = false
    enable_stdout_logs = false
    suppress_errors = false
    error_limit = 20
}
