# Applets de bandeja: nm-applet + blueman-applet (ensure-tray-services.sh).
# Los iconos van en i3bar (tray_output primary). Al clic, los menús deben flotar;
# sin estas reglas i3 los coloca en mosaico (~632×1049 px).

# Menú desplegable de red (nm-applet --indicator)
for_window [class="nm-applet"] floating enable, resize set 360 520, move position center, border pixel 0
for_window [class="Nm-applet"] floating enable, resize set 360 520, move position center, border pixel 0

# Menú desplegable de Bluetooth (blueman-applet → blueman-tray)
for_window [class="blueman-tray"] floating enable, resize set 360 520, move position center, border pixel 0
for_window [class="Blueman-tray"] floating enable, resize set 360 520, move position center, border pixel 0

# Ventana del gestor Bluetooth (clic derecho o “Administrar”)
for_window [class="blueman-manager"] floating enable, resize set 800 600, move position center
for_window [class="Blueman-manager"] floating enable, resize set 800 600, move position center
for_window [title="Bluetooth Manager"] floating enable, resize set 800 600, move position center

# Editor de conexiones (desde nm-applet)
for_window [class="nm-connection-editor"] floating enable, resize set 700 500, move position center
