# Una fila: workspaces (izq) | bumblebee-status | bandeja (der).
bar {
    font pango: Hack Nerd Font 8
    position top
    binding_mode_indicator no
    workspace_buttons yes
    tray_output primary
    tray_padding 4
    status_command ~/.config/bumblebee-status/launch.sh
    colors {
        background #222222
        statusline #eeeeee
        separator #666666
        focused_workspace   #005818 #00450b #ffffff
        active_workspace    #000445 #00450b #ffffff
        inactive_workspace  #000445 #555555 #888888
        urgent_workspace    #2f343a #900000 #ffffff
    }
}
