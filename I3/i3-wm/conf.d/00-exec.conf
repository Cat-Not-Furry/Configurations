# Bandeja (nm-applet, blueman, copyq) → scripts/ensure-tray-services.sh (tras i3bar)
# Portales, dunst, polkit → scripts/i3-environment.sh (00-env.conf)
exec_always --no-startup-id bash -c 'sleep 5 && "$HOME/.config/i3/scripts/ensure-tray-services.sh"'

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# Arrastrar ventanas en mosaico: $mod + clic (sin barra de título; default_border pixel).
tiling_drag modifier

# Block the session
exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.config/i3/scripts/lock.sh

# Touchpad configuration
exec_always --no-startup-id touchpad
exec_always --no-startup-id libinput-gestures-setup start
exec_always --no-startup-id libinput-gestures-setup restart

# Set keyboard layout
exec_always --no-startup-id setxkbmap -layout us -variant intl
exec_always --no-startup-id ~/.config/i3/scripts/keyboard-setup.sh
