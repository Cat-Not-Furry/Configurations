# Una fila: workspaces (izq) | bumblebee-status | bandeja (der).
bar {
    font pango: Hack Nerd Font 8
    position top
    binding_mode_indicator no
    workspace_buttons yes
    tray_output primary
    tray_padding 4
    status_command ~/.config/bumblebee-status/launch.sh
    colors {
        background #161821
        statusline #c6c8d1
        separator #3d4455
        focused_workspace   #565f75 #3d4455 #e2e4ea
        active_workspace    #565f75 #222633 #c6c8d1
        inactive_workspace  #3d4455 #161821 #8b919e
        urgent_workspace    #e27878 #5c3030 #161821
    }
}
