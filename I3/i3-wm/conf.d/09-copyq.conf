# CopyQ — flotante 800×600 (regla legacy que funcionaba en 07-gaps_borders.conf).
# WM_CLASS: "copyq","copyq" o "copyq","Copyq" (xprop).
for_window [class="copyq"] floating enable, resize set 800 600, move position center
